name: Build and publish Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME).
      # The third-party android-actions/setup-android step was failing, so we
      # use the preinstalled SDK and only add the exact platform we compile against.
      - name: Install Android platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      # Refresh the bundled ad/tracker list so every build ships the latest version.
      # If the download fails, the copy committed in the repo is used instead.
      - name: Update blocklist
        run: ./scripts/update-blocklist.sh || echo "::warning::Blocklist download failed; building with the committed copy."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockBrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk BlockBrowser-debug.apk
          gh release create "$TAG" BlockBrowser-debug.apk \
            --title "Block Browser $TAG" \
            --notes "Automatically built debug APK from commit ${{ github.sha }}. For testing; not a production-signed release." \
            --target "${{ github.sha }}"
