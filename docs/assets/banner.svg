<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Block Browser</title>
  <desc id="desc">The Block Browser shield blocking ads and trackers that fly towards it. Browse freely. Block distractions. Stay in control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071022"/>
      <stop offset="1" stop-color="#0f2242"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55d7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#55d7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d7ff"/>
      <stop offset="1" stop-color="#b1f7ff"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#55d7ff" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <style>
    .draw { stroke-dasharray: 700; animation: draw 1.8s ease-out both; }
    .draw2 { stroke-dasharray: 700; animation: draw 2.2s 0.3s ease-out both; }
    .rise { animation: rise 0.9s ease-out both; }
    .d1 { animation-delay: 0.5s; } .d2 { animation-delay: 0.8s; } .d3 { animation-delay: 1.1s; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    .ripple { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 0.8s 0.16s ease-out infinite; }

    /* Each tracker flies in, hits the shield bubble at 70% and vanishes. Six trackers, 0.8 s apart,
       so there's an impact every 0.8 s, in step with the ripple above. */
    .tl, .tr { opacity: 0; transform-box: fill-box; animation: 4.8s linear infinite; }
    .tl { transform-origin: right center; animation-name: fly-l; }
    .tr { transform-origin: left center; animation-name: fly-r; }
    .burst { opacity: 0; transform-box: fill-box; transform-origin: center; animation: burst 4.8s linear infinite; }
    .s0 { animation-delay: 0s; } .s1 { animation-delay: 0.8s; } .s2 { animation-delay: 1.6s; }
    .s3 { animation-delay: 2.4s; } .s4 { animation-delay: 3.2s; } .s5 { animation-delay: 4.0s; }

    @keyframes draw { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.06); } }
    @keyframes ripple { from { opacity: 0.45; transform: scale(1); } to { opacity: 0; transform: scale(1.28); } }
    @keyframes fly-l {
      0% { opacity: 0; transform: translateX(-470px) scale(1); }
      10% { opacity: 1; }
      70% { opacity: 1; transform: translateX(0) scale(1); }
      77% { opacity: 0; transform: translateX(0) scale(0.2); }
      100% { opacity: 0; transform: translateX(0) scale(0.2); }
    }
    @keyframes fly-r {
      0% { opacity: 0; transform: translateX(470px) scale(1); }
      10% { opacity: 1; }
      70% { opacity: 1; transform: translateX(0) scale(1); }
      77% { opacity: 0; transform: translateX(0) scale(0.2); }
      100% { opacity: 0; transform: translateX(0) scale(0.2); }
    }
    @keyframes burst {
      0%, 69% { opacity: 0; transform: scale(0.3); }
      72% { opacity: 1; transform: scale(0.7); }
      88% { opacity: 0; transform: scale(1.8); }
      100% { opacity: 0; transform: scale(1.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <circle cx="600" cy="128" r="200" fill="url(#glow)" class="breathe"/>

    <!-- Shield bubble the trackers hit -->
    <circle cx="600" cy="128" r="110" fill="none" stroke="#55d7ff" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="600" cy="128" r="110" fill="none" stroke="#55d7ff" stroke-width="3" class="ripple"/>

    <!-- Trackers: left side (impact at the bubble edge) -->
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
      <g transform="translate(500 83)">
        <g class="tl s0"><rect x="-104" y="-15" width="98" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="-55" y="5" text-anchor="middle" fill="#ff8fa3">ad-server</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s0"/>
      </g>
      <g transform="translate(490 128)">
        <g class="tl s2"><rect x="-86" y="-15" width="80" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="-46" y="5" text-anchor="middle" fill="#ff8fa3">tracker</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s2"/>
      </g>
      <g transform="translate(500 173)">
        <g class="tl s4"><rect x="-70" y="-15" width="64" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="-38" y="5" text-anchor="middle" fill="#ff8fa3">pixel</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s4"/>
      </g>

      <!-- Trackers: right side -->
      <g transform="translate(704 93)">
        <g class="tr s1"><rect x="6" y="-15" width="96" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="54" y="5" text-anchor="middle" fill="#ff8fa3">analytics</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s1"/>
      </g>
      <g transform="translate(709 138)">
        <g class="tr s3"><rect x="6" y="-15" width="82" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="47" y="5" text-anchor="middle" fill="#ff8fa3">malware</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s3"/>
      </g>
      <g transform="translate(698 178)">
        <g class="tr s5"><rect x="6" y="-15" width="78" height="30" rx="15" fill="#3a1424" stroke="#ff5c7a"/><text x="45" y="5" text-anchor="middle" fill="#ff8fa3">beacon</text></g>
        <circle r="16" fill="none" stroke="#ff5c7a" stroke-width="3" class="burst s5"/>
      </g>
    </g>

    <!-- The app's launcher artwork (app/src/main/res/drawable/blockbrowser_launcher.xml), scaled x2 -->
    <g transform="translate(500 26) scale(1.85)">
      <path fill="#142D53" d="M54,11 C69,20 83,22 91,23 L89,59 C87,77 73,91 54,99 C35,91 21,77 19,59 L17,23 C25,22 39,20 54,11Z"/>
      <path class="draw" stroke="#55D7FF" stroke-width="4.5" stroke-linejoin="round" fill="#09172B" d="M54,15 C68,23 80,25 86,26 L84,59 C82,74 69,87 54,94 C39,87 26,74 24,59 L22,26 C28,25 40,23 54,15Z"/>
      <path class="draw2" stroke="#58D9FF" stroke-width="3.4" fill="none" d="M76,53 A22,22 0,1 1,32 53 A22,22 0,1 1,76 53Z"/>
      <path class="draw2" stroke="#58D9FF" stroke-width="2.4" fill="none" d="M54,31 L54,75 M33,53 L75,53 M54,31 C41,43 41,63 54,75 M54,31 C67,43 67,63 54,75 M36,42 Q54,51 72,42 M36,64 Q54,55 72,64"/>
      <path class="draw2" stroke="#B1F7FF" stroke-width="5" stroke-linecap="round" fill="none" d="M25,69 C38,84 80,65 88,46"/>
    </g>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="294" font-size="60" font-weight="800" letter-spacing="-1" class="rise d1"><tspan fill="#ffffff">Block </tspan><tspan fill="url(#accent)">Browser</tspan></text>
      <text x="600" y="333" font-size="22" fill="#9fb3d1" class="rise d2">Browse freely. Block distractions. Stay in control.</text>
      <g class="rise d3" font-size="15" font-weight="600">
        <rect x="262" y="358" width="220" height="30" rx="15" fill="#55d7ff" fill-opacity="0.1" stroke="#55d7ff" stroke-opacity="0.4"/>
        <text x="372" y="378" fill="#b1f7ff">215,000+ blocked domains</text>
        <rect x="494" y="358" width="160" height="30" rx="15" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.45"/>
        <text x="574" y="378" fill="#d6c9ff">Private windows</text>
        <rect x="666" y="358" width="170" height="30" rx="15" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.45"/>
        <text x="751" y="378" fill="#b6f5ea">Video downloads</text>
        <rect x="848" y="358" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25"/>
        <text x="893" y="378" fill="#dbe4f0">Android</text>
      </g>
    </g>
  </g>
</svg>
